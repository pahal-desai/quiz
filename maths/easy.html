<html>

<head>
    <title>Maths - Easy</title>
</head>
<script src="../mathdisplayer.js"></script>

<body background="https://wallpapercave.com/wp/wp7243608.jpg" text="white"
    style="background-size: cover; background-repeat: no-repeat; background-attachment: fixed;">
    <a href="maths.html">back</a>
    <h1 align="center">Maths - Easy</h1>
    <hr>
    <form onsubmit="checkanswers(event)">
        <p>1. What is 5 + 7?</p>
        <input type="radio" name="q1" value="10"> 10<br>
        <input type="radio" name="q1" value="12"> 12<br>
        <input type="radio" name="q1" value="14"> 14<br>
        <input type="radio" name="q1" value="15"> 15<br>

        <p>2. What is 9 x 3?</p>
        <input type="radio" name="q2" value="24"> 24<br>
        <input type="radio" name="q2" value="27"> 27<br>
        <input type="radio" name="q2" value="28"> 28<br>
        <input type="radio" name="q2" value="30"> 30<br>

        <p>3. What is 20 - 8?</p>
        <input type="radio" name="q3" value="12"> 12<br>
        <input type="radio" name="q3" value="11"> 11<br>
        <input type="radio" name="q3" value="14"> 14<br>
        <input type="radio" name="q3" value="10"> 10<br>

        <p>4. How many sides does a triangle have?</p>
        <input type="radio" name="q4" value="2"> 2<br>
        <input type="radio" name="q4" value="3"> 3<br>
        <input type="radio" name="q4" value="4"> 4<br>
        <input type="radio" name="q4" value="5"> 5<br>

        <p>5. What is \(\frac{16}{4}\) ?</p>
        <input type="radio" name="q5" value="2"> 2<br>
        <input type="radio" name="q5" value="4"> 4<br>
        <input type="radio" name="q5" value="6"> 6<br>
        <input type="radio" name="q5" value="8"> 8<br>
        <br>
        <input type="submit" value="Submit">
    </form>
    <script>
        function checkanswers(e) {
            e.preventDefault();
            const answers = { q1: "12", q2: "27", q3: "12", q4: "3", q5: "4" };
            let score = 0;
            for (let q in answers) {
                const selected = document.querySelector(`input[name="${q}"]:checked`);
                if (selected && selected.value === answers[q]) {
                    score++;
                }
            }
            localStorage.setItem('score', score);
            window.location.href = "../result.html?score=" + score;
        }
    </script>
</body>

</html>
